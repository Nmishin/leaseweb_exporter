name: Publish Docker Images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  push-to-registry:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Sets KO_DOCKER_REPO=ghcr.io/<owner>/<repo> and logs in to ghcr.io with GITHUB_TOKEN
      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # ratchet:ko-build/setup-ko@v0.10

      - name: Build and push
        id: build
        run: |
          ref=$(ko build ./cmd/leaseweb_exporter \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags="${GITHUB_REF_NAME#v},latest")
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # ratchet:actions/attest@v4.2.2
        with:
          subject-name: ${{ env.KO_DOCKER_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
